services:
  # 1. Main Interactive Web Application & REST API
  - type: web
    name: mospi-airfare-index
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    startCommand: python airfare_index/live_fetcher/server.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENABLE_CLOUD_PLAYWRIGHT
        value: "1"

  # 2. Decoupled Low-Memory Ingestion Worker Cron (Runs every 30 mins)
  - type: cron
    name: airfare-ingestion-cron
    runtime: python
    region: singapore
    plan: free
    schedule: "*/30 * * * *"
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    startCommand: python airfare_index/live_fetcher/worker_scraper.py --routes DEL-BOM,DEL-BLR,BOM-BLR --once
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENABLE_CLOUD_PLAYWRIGHT
        value: "1"
